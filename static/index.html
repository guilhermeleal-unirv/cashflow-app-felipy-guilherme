<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASHFLOW - Gestão Administrativo-Financeira</title>
    <meta name="description" content="CASHFLOW: cadastros, contas a pagar/receber e lançamento automático de notas fiscais via IA.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<aside class="sidebar">
    <div class="brand">💸 CASHFLOW</div>
    <button class="nav-btn active" data-view="v-lancar" id="nav-lancar">⚡ Lançar via IA</button>
    <div class="nav-sep">Cadastros</div>
    <button class="nav-btn" data-view="v-pessoas" id="nav-pessoas">🏭 Fornecedor / Cliente</button>
    <button class="nav-btn" data-view="v-faturados" id="nav-faturados">👤 Faturado</button>
    <button class="nav-btn" data-view="v-class" id="nav-class">🏷️ Classificação</button>
    <div class="nav-sep">Movimentos</div>
    <button class="nav-btn" data-view="v-pagar" id="nav-pagar">📤 Contas a Pagar</button>
    <button class="nav-btn" data-view="v-receber" id="nav-receber">📥 Contas a Receber</button>

    <div class="sidebar-user" id="sidebarUser">
        <div class="user-info">
            <span class="user-avatar">👤</span>
            <span class="user-name" id="userNameLabel">joao.paraiba</span>
        </div>
        <button class="btn sm danger" id="btnLogout" title="Encerrar sessão" style="margin:0; width:100%;">Sair</button>
    </div>
</aside>

<main>
    <!-- ═══ Lançar via IA (Etapa 1 + Etapa 2) ═══ -->
    <section class="view active" id="v-lancar">
        <div class="card">
            <h1 class="title">Lançar Nota Fiscal via IA</h1>
            <p class="subtitle">Extrai os dados do DANFE, consulta o banco e lança a conta a pagar.</p>
            <form id="extractForm" class="row">
                <div><label for="pdfFile">Nota Fiscal (PDF)</label><input type="file" id="pdfFile" accept="application/pdf" required></div>
                <div><label for="apiKey">Gemini API Key</label><input type="password" id="apiKey" placeholder="AIzaSy..." required></div>
                <div><button class="btn" id="submitBtn" type="submit" style="width:100%"><span class="loader"></span> <span id="btnText">⚡ Analisar com IA</span></button></div>
            </form>
        </div>

        <div id="analiseCard" class="card hidden">
            <h1 class="title" style="font-size:1.15rem">Consulta no Banco de Dados</h1>
            <div class="analise" id="analise"></div>
            <div class="toolbar">
                <button class="btn" id="btnLancar">✅ Confirmar lançamento</button>
                <button class="btn secondary" id="btnDetalhes">Ver dados extraídos</button>
            </div>
            <div id="lancarMsg" class="hidden" style="margin-top:1rem"></div>
            <div id="detalhes" class="hidden" style="margin-top:1.2rem"></div>
        </div>
    </section>

    <section class="view" id="v-pessoas"></section>
    <section class="view" id="v-faturados"></section>
    <section class="view" id="v-class"></section>
    <section class="view" id="v-pagar"></section>
    <section class="view" id="v-receber"></section>
</main>

<!-- Modal de Login -->
<div class="modal-bg" id="loginModal" style="display:none; z-index:1000;">
    <form class="modal" id="loginForm" style="max-width: 400px; padding: 2.2rem;">
        <div class="brand" style="text-align: center; font-size: 1.5rem; margin-bottom: 0.5rem; padding: 0;">💸 CASHFLOW</div>
        <h2 style="text-align: center; margin-bottom: 0.3rem;">Acesso ao Sistema</h2>
        <p class="subtitle" style="text-align: center; margin-bottom: 1.3rem;">Informe suas credenciais para continuar</p>
        <div class="field" style="margin-bottom: 0.9rem;">
            <label for="loginUsername">Usuário</label>
            <input type="text" id="loginUsername" value="joao.paraiba" placeholder="ex: joao.paraiba" required autocomplete="username">
        </div>
        <div class="field" style="margin-bottom: 0.9rem;">
            <label for="loginPassword">Senha</label>
            <input type="password" id="loginPassword" value="costelaoNoDomingo" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="loginError" class="hidden" style="color: var(--danger); font-size: 0.82rem; margin-bottom: 0.8rem; text-align: center;"></div>
        <button type="submit" class="btn" id="btnLoginSubmit" style="width: 100%; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span class="loader" id="loginLoader"></span>
            <span id="loginBtnText">Entrar</span>
        </button>
    </form>
</div>

<div id="toast"></div>
<script src="/static/js/crud.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
